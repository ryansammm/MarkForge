appId: com.xyks.markforge
productName: MarkForge
copyright: © XYKS
directories:
  output: dist
  buildResources: build-resources
files:
  - electron/**
  - package.json
# Server standalone disalin oleh hook afterPack (scripts/after-pack.cjs) -
# extraFiles tidak dipakai karena menyaring direktori berawalan titik (.next).
afterPack: ./scripts/after-pack.cjs
icon: build-resources/markforge.ico
win:
  icon: build-resources/markforge.ico
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: MarkForge-Portable-${version}.exe
npmRebuild: false
compression: store
