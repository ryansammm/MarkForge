appId: com.xyks.markforge
productName: MarkForge
copyright: © XYKS
directories:
  output: dist
  buildResources: build-resources
files:
  - electron/**
  - package.json
# Server standalone + aset browser + .env disalin electron-builder sendiri
# (extraFiles) - bukan cpSync manual, karena penyalinannya battle-tested.
extraFiles:
  - from: .next/standalone
    to: server
  - from: .next/static
    to: server/.next/static
  - from: public
    to: server/public
  - from: .next/electron-build/.env
    to: server/.env
  - from: .next/electron-build/.env
    to: .env
icon: build-resources/markforge.ico
win:
  icon: build-resources/markforge.ico
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: MarkForge-Portable-${version}.exe
npmRebuild: false
# 'store' = tanpa kompresi: build hitungan menit, bukan 20-40 menit LZMA.
# Ukuran exe membesar sedikit - trade-off yang tepat untuk pemakaian pribadi.
compression: store
