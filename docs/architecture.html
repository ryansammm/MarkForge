<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morrow Architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    color-scheme: light dark;
    --paper:      #f8f7f2;
    --paper-rgb:  248,247,242;
    --ink:        #1f1b16;
    --ink-rgb:    31,27,22;
    --muted:      #6c655b;
    --muted-rgb:  108,101,91;
    --soft:       #9e9991;
    --soft-rgb:   158,153,145;
    --accent:     #21613b;
    --accent-rgb: 33,97,59;
    --link:       #275582;
    --link-rgb:   39,85,130;
    --surface:    #ffffff;
    --font-sans:  'Geist', system-ui, sans-serif;
    --font-serif: 'Lora', serif;
    --font-mono:  'Geist Mono', ui-monospace, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper:      #12120e;
      --paper-rgb:  18,18,14;
      --ink:        #e6e5df;
      --ink-rgb:    230,229,223;
      --muted:      #97958d;
      --muted-rgb:  151,149,141;
      --soft:       #74736c;
      --soft-rgb:   116,115,108;
      --accent:     #69aa77;
      --accent-rgb: 105,170,119;
      --link:       #679dd4;
      --link-rgb:   103,157,212;
      --surface:    #171813;
    }
  }

  :root[data-theme="light"] {
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper:      #12120e;
    --paper-rgb:  18,18,14;
    --ink:        #e6e5df;
    --ink-rgb:    230,229,223;
    --muted:      #97958d;
    --muted-rgb:  151,149,141;
    --soft:       #74736c;
    --soft-rgb:   116,115,108;
    --accent:     #69aa77;
    --accent-rgb: 105,170,119;
    --link:       #679dd4;
    --link-rgb:   103,157,212;
    --surface:    #171813;
  }

  body {
    font-family: var(--font-sans);
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
    transition: background-color 200ms ease, color 200ms ease;
  }

  .frame { max-width: 1200px; width: 100%; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: var(--font-serif);
    font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.15;
    color: var(--ink);
    margin-bottom: 0.5rem;
    text-wrap: balance;
  }

  .subtitle {
    font-family: var(--font-sans);
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 1.5rem;
  }

  .diagram-wrap { overflow-x: auto; }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Architecture · Morrow</p>
  <h1>Morrow, browser to durable file</h1>
  <p class="subtitle">A signed session gate, one storage core, two interchangeable backends.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="morrow-architecture-title morrow-architecture-desc">
    <title id="morrow-architecture-title">Morrow architecture: browser to durable file</title>
    <desc id="morrow-architecture-desc">Architecture diagram showing Morrow's browser routed through a session gate to either authenticated API routes or a public share page, both settling through one WorkspaceStore core onto a filesystem or Cloudflare R2 backend.</desc>

    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--muted)"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--accent)"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--link)"/></marker>
    </defs>

    <rect width="100%" height="100%" style="fill:var(--paper)"/>

    <!-- ============ ARROWS (behind nodes) ============ -->

    <!-- 1. Browser -> Middleware (HTTPS, link) -->
    <line x1="470" y1="104" x2="470" y2="160" style="stroke:var(--link)" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="480" y="126" width="40" height="12" rx="2" style="fill:var(--paper)"/>
    <text x="500" y="135" style="fill:var(--link)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

    <!-- 2. Middleware -> API Routes (AUTHORIZED, muted) -->
    <path d="M420,224 V244 Q420,252 412,252 H328 Q320,252 320,260 V280"
          fill="none" style="stroke:var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="335" y="232" width="70" height="12" rx="2" style="fill:var(--paper)"/>
    <text x="370" y="241" style="fill:var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUTHORIZED</text>

    <!-- 3. Middleware -> Public Share Page (PUBLIC, dashed) -->
    <path d="M520,224 V244 Q520,252 528,252 H612 Q620,252 620,260 V280"
          fill="none" style="stroke:var(--muted)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="552" y="232" width="36" height="12" rx="2" style="fill:var(--paper)"/>
    <text x="570" y="241" style="fill:var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUBLIC</text>

    <!-- 4. API Routes -> WorkspaceStore (READ / WRITE, accent, focal) -->
    <line x1="320" y1="344" x2="320" y2="400" style="stroke:var(--accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="330" y="366" width="76" height="12" rx="2" style="fill:var(--paper)"/>
    <text x="368" y="375" style="fill:var(--accent)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ / WRITE</text>

    <!-- 5. API Routes -> Share Store (TOKENS, muted) -->
    <path d="M420,312 H462 Q470,312 470,320 V424 Q470,432 478,432 H520"
          fill="none" style="stroke:var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="480" y="366" width="44" height="12" rx="2" style="fill:var(--paper)"/>
    <text x="502" y="375" style="fill:var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOKENS</text>

    <!-- 6. Public Share Page -> Share Store (RESOLVE, muted) -->
    <line x1="620" y1="344" x2="620" y2="400" style="stroke:var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="630" y="366" width="50" height="12" rx="2" style="fill:var(--paper)"/>
    <text x="655" y="375" style="fill:var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESOLVE</text>

    <!-- 7. WorkspaceStore -> FsBucket (BYTES, muted) -->
    <line x1="260" y1="464" x2="260" y2="520" style="stroke:var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="270" y="486" width="36" height="12" rx="2" style="fill:var(--paper)"/>
    <text x="288" y="495" style="fill:var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BYTES</text>

    <!-- 8. WorkspaceStore -> R2Bucket (BYTES, muted) -->
    <path d="M380,464 V484 Q380,492 388,492 H452 Q460,492 460,500 V520"
          fill="none" style="stroke:var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="402" y="472" width="36" height="12" rx="2" style="fill:var(--paper)"/>
    <text x="420" y="481" style="fill:var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BYTES</text>

    <!-- ============ NODES ============ -->

    <!-- Browser (input) -->
    <rect x="370" y="40" width="200" height="64" rx="6" style="fill:var(--paper)"/>
    <rect x="370" y="40" width="200" height="64" rx="6" style="fill:rgba(var(--muted-rgb),0.10);stroke:var(--soft)" stroke-width="1"/>
    <rect x="378" y="48" width="28" height="12" rx="2" fill="transparent" style="stroke:rgba(var(--soft-rgb),0.40)" stroke-width="0.8"/>
    <text x="392" y="57" style="fill:var(--soft)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
    <text x="470" y="76" style="fill:var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser</text>
    <text x="470" y="92" style="fill:var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">React UI · service worker</text>

    <!-- Middleware (security boundary, dashed) -->
    <rect x="370" y="160" width="200" height="64" rx="6" style="fill:var(--paper)"/>
    <rect x="370" y="160" width="200" height="64" rx="6" style="fill:rgba(var(--accent-rgb),0.05);stroke:var(--accent)" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4,4"/>
    <rect x="378" y="168" width="32" height="12" rx="2" fill="transparent" style="stroke:rgba(var(--accent-rgb),0.40)" stroke-width="0.8"/>
    <text x="394" y="177" style="fill:var(--accent)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
    <text x="470" y="196" style="fill:var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Middleware</text>
    <text x="470" y="212" style="fill:var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">middleware.ts · HMAC</text>

    <!-- API Routes (backend) -->
    <rect x="220" y="280" width="200" height="64" rx="6" style="fill:var(--paper)"/>
    <rect x="220" y="280" width="200" height="64" rx="6" style="fill:var(--surface);stroke:var(--ink)" stroke-width="1"/>
    <rect x="228" y="288" width="28" height="12" rx="2" fill="transparent" style="stroke:rgba(var(--ink-rgb),0.40)" stroke-width="0.8"/>
    <text x="242" y="297" style="fill:var(--ink)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
    <text x="320" y="316" style="fill:var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API Routes</text>
    <text x="320" y="332" style="fill:var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">app/api/*</text>

    <!-- Public Share Page (external) -->
    <rect x="520" y="280" width="200" height="64" rx="6" style="fill:var(--paper)"/>
    <rect x="520" y="280" width="200" height="64" rx="6" style="fill:rgba(var(--ink-rgb),0.03);stroke:rgba(var(--ink-rgb),0.30)" stroke-width="1"/>
    <rect x="528" y="288" width="28" height="12" rx="2" fill="transparent" style="stroke:rgba(var(--ink-rgb),0.22)" stroke-width="0.8"/>
    <text x="542" y="297" style="fill:var(--soft)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PUB</text>
    <text x="620" y="316" style="fill:var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Share Page</text>
    <text x="620" y="332" style="fill:var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">app/share/[token]</text>

    <!-- WorkspaceStore (focal) -->
    <rect x="220" y="400" width="200" height="64" rx="6" style="fill:var(--paper)"/>
    <rect x="220" y="400" width="200" height="64" rx="6" style="fill:rgba(var(--accent-rgb),0.08);stroke:var(--accent)" stroke-width="1"/>
    <rect x="228" y="408" width="32" height="12" rx="2" fill="transparent" style="stroke:rgba(var(--accent-rgb),0.50)" stroke-width="0.8"/>
    <text x="244" y="417" style="fill:var(--accent)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
    <text x="320" y="436" style="fill:var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WorkspaceStore</text>
    <text x="320" y="452" style="fill:var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">etags · index · path safety</text>

    <!-- Share Store (data store) -->
    <rect x="520" y="400" width="200" height="64" rx="6" style="fill:var(--paper)"/>
    <rect x="520" y="400" width="200" height="64" rx="6" style="fill:rgba(var(--ink-rgb),0.05);stroke:var(--muted)" stroke-width="1"/>
    <rect x="528" y="408" width="28" height="12" rx="2" fill="transparent" style="stroke:rgba(var(--muted-rgb),0.50)" stroke-width="0.8"/>
    <text x="542" y="417" style="fill:var(--muted)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOK</text>
    <text x="620" y="436" style="fill:var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Share Store</text>
    <text x="620" y="452" style="fill:var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">share-store.ts</text>

    <!-- FsBucket (data store) -->
    <rect x="180" y="520" width="160" height="64" rx="6" style="fill:var(--paper)"/>
    <rect x="180" y="520" width="160" height="64" rx="6" style="fill:rgba(var(--ink-rgb),0.05);stroke:var(--muted)" stroke-width="1"/>
    <rect x="188" y="528" width="24" height="12" rx="2" fill="transparent" style="stroke:rgba(var(--muted-rgb),0.50)" stroke-width="0.8"/>
    <text x="200" y="537" style="fill:var(--muted)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FS</text>
    <text x="260" y="556" style="fill:var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FsBucket</text>
    <text x="260" y="572" style="fill:var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NOTES_DIR</text>

    <!-- R2Bucket (external / cloud) -->
    <rect x="380" y="520" width="160" height="64" rx="6" style="fill:var(--paper)"/>
    <rect x="380" y="520" width="160" height="64" rx="6" style="fill:rgba(var(--ink-rgb),0.03);stroke:rgba(var(--ink-rgb),0.30)" stroke-width="1"/>
    <rect x="388" y="528" width="24" height="12" rx="2" fill="transparent" style="stroke:rgba(var(--ink-rgb),0.22)" stroke-width="0.8"/>
    <text x="400" y="537" style="fill:var(--soft)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">R2</text>
    <text x="460" y="556" style="fill:var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">R2Bucket</text>
    <text x="460" y="572" style="fill:var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Cloudflare · S3 API</text>

    <!-- ============ LEGEND ============ -->
    <line x1="40" y1="624" x2="860" y2="624" style="stroke:rgba(var(--ink-rgb),0.12)" stroke-width="0.8"/>
    <text x="40" y="640" style="fill:var(--muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="656" width="14" height="10" rx="2" style="fill:rgba(var(--muted-rgb),0.10);stroke:var(--soft)" stroke-width="1"/>
    <text x="60" y="665" style="fill:var(--muted)" font-size="8.5" font-family="'Geist', sans-serif">Client</text>

    <rect x="108" y="656" width="14" height="10" rx="2" style="fill:rgba(var(--accent-rgb),0.05);stroke:var(--accent)" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="128" y="665" style="fill:var(--muted)" font-size="8.5" font-family="'Geist', sans-serif">Session boundary</text>

    <rect x="226" y="656" width="14" height="10" rx="2" style="fill:var(--surface);stroke:var(--ink)" stroke-width="1"/>
    <text x="246" y="665" style="fill:var(--muted)" font-size="8.5" font-family="'Geist', sans-serif">Route handler</text>

    <rect x="329" y="656" width="14" height="10" rx="2" style="fill:rgba(var(--ink-rgb),0.03);stroke:rgba(var(--ink-rgb),0.30)" stroke-width="1"/>
    <text x="349" y="665" style="fill:var(--muted)" font-size="8.5" font-family="'Geist', sans-serif">Public surface</text>

    <rect x="437" y="656" width="14" height="10" rx="2" style="fill:rgba(var(--ink-rgb),0.05);stroke:var(--muted)" stroke-width="1"/>
    <text x="457" y="665" style="fill:var(--muted)" font-size="8.5" font-family="'Geist', sans-serif">Data store</text>

    <rect x="525" y="656" width="14" height="10" rx="2" style="fill:rgba(var(--accent-rgb),0.08);stroke:var(--accent)" stroke-width="1"/>
    <text x="545" y="665" style="fill:var(--muted)" font-size="8.5" font-family="'Geist', sans-serif">Focal core</text>

    <line x1="613" y1="661" x2="641" y2="661" style="stroke:var(--link)" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <text x="649" y="665" style="fill:var(--muted)" font-size="8.5" font-family="'Geist', sans-serif">HTTP request</text>

    <line x1="711" y1="661" x2="739" y2="661" style="stroke:var(--accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="747" y="665" style="fill:var(--muted)" font-size="8.5" font-family="'Geist', sans-serif">Primary flow</text>
  </svg>
  </div>
</div>
</body>
</html>
