name: verify

# Gerbang kualitas: deps + encoding + typecheck + lint + test + build.
# Menggunakan pnpm agar konsisten dengan lockfile utama (pnpm-lock.yaml).
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # No R2 credentials here on purpose. The conformance suite includes R2 only
      # when credentials are present, and a pull request from a fork must never
      # reach a real bucket. The R2 write path is covered by r2-integration.yml.
      - run: pnpm install --frozen-lockfile

      - run: pnpm verify
