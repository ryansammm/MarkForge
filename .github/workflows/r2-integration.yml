name: r2-integration

# The R2 write path against a real bucket (production-readiness plan §1.3).
#
# Separate from `verify` for one reason: it needs credentials, and a workflow that
# needs credentials must never run on a pull request from a fork. It runs on a
# schedule and on demand, on this repository only.
#
# Required secrets — point R2_TEST_BUCKET at a SCRATCH bucket. This suite writes and
# deletes. It refuses to run without R2_TEST_BUCKET rather than falling back to
# R2_BUCKET, so a missing secret is a skipped run and never a wiped corpus.
on:
  schedule:
    # 04:00 UTC on Mondays. Frequent enough to catch a Cloudflare behaviour change
    # before it matters, rare enough that nobody starts ignoring the email.
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  r2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skips silently on forks rather than failing with a confusing credential error.
    if: github.repository_owner != ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Fail loudly if the scratch bucket is not configured
        env:
          R2_TEST_BUCKET: ${{ secrets.R2_TEST_BUCKET }}
        run: |
          if [ -z "$R2_TEST_BUCKET" ]; then
            echo "R2_TEST_BUCKET is not set. This job proves the only durable backend's"
            echo "write path; a green run that touched nothing is worse than a red one."
            exit 1
          fi

      - run: npm run test:r2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TEST_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TEST_SECRET_ACCESS_KEY }}
          R2_TEST_BUCKET: ${{ secrets.R2_TEST_BUCKET }}
          # Not R2_BUCKET. Nothing in this job should be able to resolve the real one.
